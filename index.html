
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce Product Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="product-section">
    <h2>Watches</h2>

    <div class="product-grid">
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=400" alt="Classic Watch">
        <h3>Classic Watch</h3>
        <p>1120Rs</p>
        <button>Order</button>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=400" alt="Luxury Watch">
        <h3>Luxury Watch</h3>
        <p>1250Rs</p>
        <button>Order</button>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1542496658-e33a6d0d50f6?w=400" alt="Sport Watch">
        <h3>Sport Watch</h3>
        <p>1160Rs</p>
        <button>Order</button>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1508057198894-247b23fe5ade?w=400" alt="Minimal Watch">
        <h3>Minimal Watch</h3>
        <p>1110Rs</p>
        <button>Order</button>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400" alt="Smart Watch">
        <h3>Smart Watch</h3>
        <p>1900Rs</p>
        <button>Order</button>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?w=400" alt="Leather Watch">
        <h3>Leather Watch</h3>
        <p>1140Rs</p>
        <button>Order</button>
      </div>
    </div>
  </section>

  <section class="product-section">
    <h2>Shoes</h2>

    <div class="product-grid">
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" alt="Running Shoes">
        <h3>Running Shoes</h3>
        <p>1290Rs</p>
        <button>Order</button>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=400" alt="Sneakers">
        <h3>Sneakers</h3>
        <p>1680Rs</p>
        <button>Order</button>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1614252235316-8c857d38b5f4?w=400" alt="Formal Shoes">
        <h3>Formal Shoes</h3>
        <p>1110Rs</p>
        <button>Order</button>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1460353581641-37baddab0fa2?w=400" alt="Sports Shoes">
        <h3>Sports Shoes</h3>
        <p>1195Rs</p>
        <button>Order</button>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400" alt="High-Top Shoes">
        <h3>High-Top Shoes</h3>
        <p>1100Rs</p>
        <button>Order</button>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1495555961986-6d4c1ecb7be3?w=400" alt="Slip-On Shoes">
        <h3>Slip-On Shoes</h3>
        <p>1270Rs</p>
        <button>Order</button>
      </div>
    </div>
  </section>

</body>
</html>
